name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        default: v2026.8.2

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install environment
        run: uv sync --extra dev
      - name: Build exact artifacts
        run: uv build
      - name: Validate release identity
        run: uv run python scripts/check_release.py --tag "${RELEASE_TAG}"
      - name: Test
        run: uv run pytest -q
      - name: Publish exact artifacts
        run: >
          uv publish
          --trusted-publishing automatic
          --check-url https://pypi.org/simple/
          dist/*
      - name: Verify version on PyPI
        run: |
          uv run python scripts/verify_pypi_release.py \
            lockin-blocker "${RELEASE_TAG#v}"

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Create matching GitHub Release
        run: |
          version="${RELEASE_TAG#v}"
          if gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "lockin $version" \
            --generate-notes; then
            exit 0
          fi
          if state=$(gh release view "$RELEASE_TAG" \
            --json tagName,isDraft,isPrerelease,publishedAt \
            --jq '[.tagName, .isDraft, .isPrerelease, .publishedAt] | @tsv'); then
            IFS=$'\t' read -r tag_name is_draft is_prerelease published_at <<< "$state"
          fi
          if [ "${tag_name:-}" = "$RELEASE_TAG" ] \
            && [ "${is_draft:-}" = "false" ] \
            && [ "${is_prerelease:-}" = "false" ] \
            && [ -n "${published_at:-}" ]; then
            echo "GitHub Release already exists: $RELEASE_TAG"
          else
            echo "GitHub Release is missing, draft, prerelease, or conflicting: $RELEASE_TAG" >&2
            exit 1
          fi
