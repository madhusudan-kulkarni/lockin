# lockin default rules — named blocklists.
# Each entry is a hostname. lockin also blocks www.<name>, a few common
# subdomains (m, mobile, old, new, i, www2), and known aliases
# (youtu.be, fb.com, …). Globs and URL paths are not supported.

default: social

blacklists:
  social:
    - twitter.com
    - x.com
    - facebook.com
    - instagram.com
    - reddit.com
    - tiktok.com
    - linkedin.com
    - youtube.com
    - twitch.tv

  news:
    - cnn.com
    - nytimes.com
    - bbc.com
    - news.ycombinator.com
    - reddit.com
