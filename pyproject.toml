[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lockin-blocker"
version = "2026.8.2"
description = "Block distracting websites on Linux — system-level blocking via /etc/hosts and nftables"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Madhusudan Kulkarni", email = "hello@madhusudan.dev" },
]
keywords = [
    "focus",
    "productivity",
    "self-control",
    "website-blocker",
    "linux",
    "nftables",
    "cli",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/madhusudan-kulkarni/lockin"
Repository = "https://github.com/madhusudan-kulkarni/lockin"
Issues = "https://github.com/madhusudan-kulkarni/lockin/issues"

[project.scripts]
lockin = "lockin.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["lockin"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
